[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotx-mood"
version = "1.0.4"
description = "Contextual conformal calibration experiments for BBB and CNS screening"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  {name = "Phongsakon Sriwicha"},
  {name = "Santitham Prom-on"}
]
dependencies = [
  "numpy==2.4.3",
  "pandas==3.0.1",
  "rdkit==2025.9.6",
  "scikit-learn==1.8.0",
  "scipy==1.17.1"
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
neural = [
  "accelerate==1.13.0",
  "chemprop==2.2.3",
  "torch==2.6.0",
  "torch-geometric==2.7.0",
  "transformers==5.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
